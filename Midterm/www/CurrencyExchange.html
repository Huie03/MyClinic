<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Information - UUM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-light py-3 border-bottom">
  <div class="container d-flex align-items-center">
    <img src="https://upload.wikimedia.org/wikipedia/ms/9/9e/Logo_UUM.jpg" alt="UUM Logo" style="height:60px;" class="me-3">
    <div>
      <h3 class="mb-0">Universiti Utara Malaysia (UUM)</h3>
      <p class="mb-0">STIWK2114 – Mobile Programming</p>
      <small><strong>Midterm Examination</strong> | Duration: 2 Hours</small>
    </div>
  </div>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">STIWK2114</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="StudentInformation.html">Student Information</a></li>
        <li class="nav-item"><a class="nav-link" href="CurrencyExchange.html">Currency Exchange</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Currency Exchange (MYR)</h4>
    </div>
    <div class="card-body">
      <form id="exchangeForm" onsubmit="event.preventDefault(); getRates();">
        <div class="mb-3">
          <label class="form-label">Amount in (MYR)</label>
          <input type="number" id="amount" class="form-control" placeholder="Enter amount in (MYR)" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Target currency</label>
            <select id="target" class="form-select" required>
                <option value="">Choose target currency...</option>
                <option value="USD">USA</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Convert</button>
      </form>
    </div>

    <div class="card-footer bg-light py-3 d-none" id="outArea">
      <div id="resultOutput" class="text-center fw-bold"></div>
    </div>
  </div>
</section>

<footer class="bg-dark text-white text-center py-3 mt-4">
  <small>&copy; Universiti Utara Malaysia | STIWK2114</small>
</footer>

<script>
    function getRates() {
        const amount = document.getElementById('amount').value;
        const target = document.getElementById('target').value;
        const outArea = document.getElementById('outArea');
        const resultOutput = document.getElementById('resultOutput');

        fetch('https://open.er-api.com/v6/latest/MYR')
            .then(response => response.json())
            .then(data => {
                const rate = data.rates[target];
                const convertedValue = (amount * rate).toFixed(2);
                
                outArea.classList.remove('d-none');
                resultOutput.innerHTML = amount + " MYR = " + convertedValue + " " + target;
            })
            .catch(error => {
                outArea.classList.remove('d-none');
                resultOutput.innerHTML = 'Error: ' + error;
            });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
